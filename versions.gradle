def versions = [:]
versions.gdx = '1.13.5'
versions.junit = '6.1.3'

def deps = [:]

def gdx = [:]
gdx.gdx = "com.badlogicgames.gdx:gdx:$versions.gdx"
gdx.backend_lwjgl3 = "com.badlogicgames.gdx:gdx-backend-lwjgl3:$versions.gdx"
gdx.platform_desktop = "com.badlogicgames.gdx:gdx-platform:$versions.gdx:natives-desktop"
